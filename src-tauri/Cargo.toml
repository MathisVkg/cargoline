[package]
name = "cargo-line"
version = "1.0.0-beta.1"
description = "Cargo Line — offline-first Star Citizen hauling contract manager (unofficial)"
authors = ["Cargo Line contributors"]
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the library and binary targets on Windows.
name = "cargo_line_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Bundled SQLite: no system library required; version pinned to the range
# supported by rusqlite_migration.
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Local calendar date and UTC offset for date-based runs (already a Tauri dependency).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# PNG encoding of screenshots (already in the dependency tree through Tauri's codegen).
png = "0.18"
# Native open-file dialog for the Game.log path (Task 10.1; only `dialog:allow-open` is granted).
tauri-plugin-dialog = "=2.8.4"

# Native screen capture: the same `windows` version Tauri already uses (no second copy).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Wdk_System_SystemInformation",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# Screenshot PNG encoding is CPU-heavy; keep it fast in debug builds too.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

# Release builds (Task 18), measured on this project (from scratch, this PC):
# - default: 14.5 MB, 98 s;
# - lto = true + codegen-units = 1: 13.3 MB, about 180 s (chosen);
# - the same with opt-level = "s": 9.9 MB, but a 4K screenshot PNG encodes about 3.5x slower
#   (LTO re-optimises the PNG code at the binary's size level), so not used.
# `strip` is not set: with MSVC the debug info is in the separate .pdb, so it changes nothing.
# `panic` stays "unwind": a panic in a command's blocking job becomes an error reply
# (`run_blocking`) instead of closing the app. CI builds debug only.
[profile.release]
lto = true
codegen-units = 1
